# Reverse proxy for the API.  TLS ends here; Spring Boot listens on localhost only.
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/loan-api
#   (edit server_name) ; sudo ln -s /etc/nginx/sites-available/loan-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.<your-domain>        # adds the HTTPS server block and certificates
server {
    listen 80;
    server_name api.<your-domain>;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # The backend trusts these (server.forward-headers-strategy=framework) to know the
        # request was HTTPS and who the real client is (rate limiting).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
