# Static hosting for the React dashboard (the contents of web's dist/ folder).
#   sudo certbot --nginx -d <dashboard-domain>
server {
    listen 80;
    server_name <dashboard-domain>;
    root /var/www/loan-dashboard;
    index index.html;

    # Single-page app: every route that is not a file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
