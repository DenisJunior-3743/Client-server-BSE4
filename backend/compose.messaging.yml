# Isolated local learning environment; does not connect to Neon or Atlas.
# docker compose -f compose.messaging.yml up --build -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loan-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loans"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: loan
      RABBITMQ_DEFAULT_PASS: local-development-only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - loan-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: .
    image: trustbank-loan-backend:local
    environment: &app-environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/loans
      DATABASE_USER: postgres
      DATABASE_PASSWORD: local-development-only
      JWT_SECRET: local-development-only-secret-at-least-32-bytes
      MESSAGING_ENABLED: "true"
      MESSAGING_WORKER_ENABLED: "false"
      RABBITMQ_ADDRESSES: amqp://loan:local-development-only@rabbitmq:5672/
      BOOTSTRAP_ADMIN_ENABLED: "true"
      DB_POOL_MIN_IDLE: "0"
      MONGODB_URI: ""
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  worker:
    image: trustbank-loan-backend:local
    environment:
      <<: *app-environment
      MESSAGING_WORKER_ENABLED: "true"
      BOOTSTRAP_ADMIN_ENABLED: "false"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
volumes:
  loan-postgres:
  loan-rabbitmq:
